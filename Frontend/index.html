<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Research Opportunity Portal</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app-shell">

  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">RO</span>
      <div>
        <h1>Research<br />Opportunities</h1>
        <p class="brand-tagline">University research portal</p>
      </div>
    </div>

    <div class="sidebar-search">
      <input type="search" id="searchInput" placeholder="Search title, department, area…" />
    </div>

    <div class="filter-group" role="tablist" aria-label="Filter by status">
      <button class="filter-btn active" data-status="">All</button>
      <button class="filter-btn" data-status="Open">Open</button>
      <button class="filter-btn" data-status="Closed">Closed</button>
    </div>

    <div class="sidebar-stats" id="sidebarStats"></div>

    <div class="sidebar-footer">
      <button class="btn-primary" id="btnNew" type="button">+ Post opportunity</button>
    </div>
  </aside>

  <main class="main-panel">
    <div class="panel-heading">
      <h2 id="panelHeading">All opportunities</h2>
      <span class="panel-count" id="panelCount"></span>
    </div>

    <div id="loadingState" class="list-skeleton">
      <div class="skeleton-row"></div>
      <div class="skeleton-row"></div>
      <div class="skeleton-row"></div>
    </div>

    <div id="emptyState" class="empty-state d-none">
      <p>No opportunities match your filters.</p>
    </div>

    <ul class="opp-index" id="oppList"></ul>
  </main>

</div>

<div id="toastStack" class="toast-stack" aria-live="polite"></div>

<div class="drawer-overlay" id="drawerOverlay"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-header">
    <span id="drawerStatusPill" class="status-pill"></span>
    <button class="drawer-close" id="drawerClose" type="button" aria-label="Close">&times;</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <p id="confirmMessage"></p>
    <div class="confirm-actions">
      <button class="btn-ghost" id="confirmCancel" type="button">Cancel</button>
      <button class="btn-danger" id="confirmOk" type="button">Delete</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
